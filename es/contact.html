<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Contact Us - Latin Mambo</title>
        <link rel="stylesheet" href="/style.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
        <script src="/script.js" defer></script>
    </head>
    <body>
        <div id="header-container"></div>
        <div id="menu-container"></div>

        <main class="contact-section">
            <h1>Contactanos</h1>
            <p>Si tienes preguntas sobre nuestras clases, eventos, quieres hacer alguna compra o deseas colaborar con nosotros, ¡envíanos un mensaje!</p>

            <!-- 🔹 FORMULARIO FORMSPREE -->
            <form id="contactForm" class="contact-form" action="https://formspree.io/f/mpwkagee" method="POST">
                <div class="form-group">
                    <label for="name">Nombre:</label>
                    <input type="text" id="name" name="name" placeholder="Your full name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="_replyto" placeholder="example@email.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Teléfono:</label>
                    <input type="tel" id="phone" name="phone" placeholder="+49 171 2345678">
                </div>

                <div class="form-group">
                    <label for="message">Mensaje:</label>
                    <textarea id="message" name="message" rows="6" placeholder="Write your message here..." required></textarea>
                </div>

                <div class="form-group consent-inline">
                    <input type="checkbox" id="consent" name="consent" required>
                    <label for="consent">
                        Acepto la recopilación y el tratamiento de mis datos personales de acuerdo con la
                        <a href="/es/privacy-policy.html" target="_blank">Política de Privacidad</a>.
                    </label>
                </div>

                <button type="submit" class="contact-button">Enviar Mensaje</button>
            </form>

            <!-- 🔹 Mensaje de confirmación oculto por defecto -->
            <div id="formMessage" class="form-message"></div>
        </main>

        <div id="footer-container"></div>
    </body>
</html>
